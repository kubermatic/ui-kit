# All three jobs are always_run: this repo is small and every path in it feeds
# the same three commands, so run_if_changed would only add a way for a change
# to skip its own verification.
#
# preset-goproxy is "false" throughout — there is no Go here. The build image is
# shared with the Go repos and is the one that carries a usable Node.

presubmits:
  - name: pre-ui-kit-verify
    always_run: true
    decorate: true
    clone_uri: 'ssh://git@github.com/kubermatic/ui-kit.git'
    labels:
      preset-goproxy: 'false'
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-8
          command:
            - ./hack/ci/verify.sh
          resources:
            requests:
              memory: 2Gi
              cpu: 1

  # Split from verify because this one downloads a browser. Keeping the static
  # checks in their own job means a type error reports in seconds instead of
  # waiting behind a Chromium install.
  - name: pre-ui-kit-test
    always_run: true
    decorate: true
    clone_uri: 'ssh://git@github.com/kubermatic/ui-kit.git'
    labels:
      preset-goproxy: 'false'
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-8
          command:
            - ./hack/ci/test.sh
          env:
            # Playwright caches its browsers under $HOME. Without this the
            # install and the test run can disagree about where they live.
            - name: HOME
              value: /root
          resources:
            requests:
              memory: 4Gi
              cpu: 2

  - name: pre-ui-kit-build
    always_run: true
    decorate: true
    clone_uri: 'ssh://git@github.com/kubermatic/ui-kit.git'
    labels:
      preset-goproxy: 'false'
    spec:
      containers:
        - image: quay.io/kubermatic/build:go-1.26-node-22-8
          command:
            - ./hack/ci/build.sh
          resources:
            requests:
              memory: 4Gi
              cpu: 2
# Publishing to GitHub Packages, left commented out on purpose — the same shape
# template-project uses for a job that is written but not yet wired.
#
# hack/ci/publish.sh is ready and is idempotent, so this is safe to run on every
# merge: it publishes only when the version in package.json is one the registry
# has not seen. What is missing is the credential. No Kubermatic repo publishes
# an npm package today, so there is no preset for a registry token the way there
# is for docker (preset-docker-push) or vault (preset-vault), and ui-kit would be
# the first. Uncommenting this before that secret exists buys nothing except a
# postsubmit that fails on every merge to main.
#
# To enable: have infra provision a GitHub Packages token with write:packages,
# expose it the way preset-vault exposes its secrets, and uncomment.
