# Netlify builds and serves the Storybook catalogue, at
# https://ui-kit-kubermatic.netlify.app. This is the only deployment; the build
# in hack/ci/verify.sh is a presubmit smoke test that publishes nothing.
#
# The site is served from the origin root, and a deploy preview from the root of
# its own subdomain, so Vite's default base is correct and nothing has to pass a
# subdirectory in.

[build]
  command = "npm run build-storybook"
  publish = "storybook-static"

[build.environment]
  # Also in .nvmrc, which Netlify reads; repeated here so the build image's
  # default cannot apply if that file ever moves. packages require >=24.
  NODE_VERSION = "24"
  # Workspace root installs need the dev dependencies — Storybook, Vite and
  # Tailwind all live there. Netlify sets NODE_ENV=production for builds, which
  # would otherwise make `npm ci` skip them.
  NPM_FLAGS = "--include=dev"

# Storybook links to stories with a query string (`/?path=/story/…`), so deep
# links already resolve to the index. Everything else on disk is a real file;
# no SPA fallback, so a missing asset stays a 404 instead of silently serving
# HTML in its place.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed filenames under assets/ are immutable; anything else is revalidated so
# a redeploy is picked up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
